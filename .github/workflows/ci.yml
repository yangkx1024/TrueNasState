name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4

      - name: Verify Swift 6.4 toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift_version="$(swift --version)"
          echo "$swift_version"
          if [[ "$swift_version" != *"Apple Swift version 6.4 "* ]]; then
            echo "Expected Apple Swift 6.4 from the Xcode 27 runner." >&2
            exit 1
          fi

      # Signing is disabled: the runner has no access to the development team, and
      # unit tests only need the host app to launch, not to be distributable.
      - name: Run tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project TrueNasState.xcodeproj \
            -scheme TrueStats \
            -configuration Debug \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM=

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult

  build-release:
    name: Release build
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4

      - name: Verify Swift 6.4 toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift_version="$(swift --version)"
          echo "$swift_version"
          if [[ "$swift_version" != *"Apple Swift version 6.4 "* ]]; then
            echo "Expected Apple Swift 6.4 from the Xcode 27 runner." >&2
            exit 1
          fi

      # Catches warnings and errors that only the optimizer surfaces, which the
      # Debug test job would otherwise miss.
      - name: Build Release
        run: |
          set -euo pipefail
          xcodebuild build \
            -project TrueNasState.xcodeproj \
            -scheme TrueStats \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM=

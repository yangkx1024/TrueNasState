name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $latest"
          sudo xcode-select -switch "$latest"
          xcodebuild -version
          swift --version

      # Signing is disabled: the runner has no access to the development team, and
      # unit tests only need the host app to launch, not to be distributable.
      - name: Run tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project TrueNasState.xcodeproj \
            -scheme TrueStats \
            -configuration Debug \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM=

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult

  build-release:
    name: Release build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -switch "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      # Catches warnings and errors that only the optimizer surfaces, which the
      # Debug test job would otherwise miss.
      - name: Build Release
        run: |
          set -euo pipefail
          xcodebuild build \
            -project TrueNasState.xcodeproj \
            -scheme TrueStats \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM=
